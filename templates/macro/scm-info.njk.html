{%- macro scmInfo(build, scm) -%}
       <span class="version-text-block">{{ scm.branch }}</span>  (<a href="{{ scm.commitUrl }}">{{ scm.commitShort }}</a>)<br />
        {% if scm.pr %}<a href="{{ scm.prUrl }}">PR {{ scm.pr }}</a><br />{% endif %}
       <span class="version-text-block">{{ build.date }} {{ build.time }}</span>
{%- endmacro -%}
