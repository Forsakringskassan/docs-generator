{%- macro scmInfo(build, scm) -%}
       <span>{{ scm.branch }}</span>  (<a href="{{ scm.commitUrl }}">{{ scm.commitShort }}</a>)<br />
        {% if scm.pr %}<a href="{{ scm.prUrl }}">PR {{ scm.pr }}</a><br />{% endif %}
       <span>{{ build.date }}</span> <span>{{ build.time }}</span>
{%- endmacro -%}
